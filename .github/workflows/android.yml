name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn

      - name: Fail when Gradle fails
        if: steps.assemble.outcome == 'failure'
        run: exit 1
